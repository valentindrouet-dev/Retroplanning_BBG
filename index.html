:root[data-theme="dark"]{--bg:#101512;--surface:#18201B;--ink:#E6ECE8;--muted:#98A59D;--line:#2B3530;--soft:#1D2620;--late:#E26B5E;--tight:#E0A84A;--ok:#5FB283;--camino:#6FB07F;--edit:#E3B25A;--torna:#6FA6E0;--bbg:#B394E3;--dist:#E8705F;--focus:#8FB0FF}

  var rows={},proj=today,tot=0,dn=0,late=0,nopt=0;
  g.tasks.forEach(function(t){var l=lf(t.id),e=ef(t.id),r=rem(t);var lim=plf(t.id),ps=t.start?parse(t.start):addD(lim,-dur(t)),pe=t.start?addD(ps,dur(t)):lim;rows[t.id]={over:diff(pe,lim),dur:dur(t),rem:r,lf:l,ls:addD(l,-r),ef:e,es:addD(e,-r),slack:diff(l,e),pe:pe,ps:ps,delay:t.s===0?diff(today,ps):t.s===1?Math.round(diff(today,ps)-dur(t)*(t.p||0)/100):0};

}
